<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- One source of truth for the palette: extension/tokens.js, shared
         with the chip and the panel. Applied before first paint by the inline
         script below, so there is no flash of unstyled popup. -->
    <script src="tokens.js"></script>
    <script>
      document.documentElement.style.cssText = window.DC_TOKENS.cssVars
    </script>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 280px;
        background: var(--dc-card);
        color: var(--dc-ink);
        font-family: var(--dc-font);
        font-size: 13px;
        line-height: 1.5;
      }
      .wrap { padding: 14px; }

      .brand {
        display: flex; align-items: center; gap: 7px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--dc-rule);
      }
      .brand img { width: 16px; height: 16px; border-radius: 3px; }
      .brand span { font-weight: 600; letter-spacing: -0.01em; }

      .body { padding: 12px 0; min-height: 62px; }

      /* The status line: who you are, what plan. */
      .who { display: flex; align-items: center; gap: 6px; }
      .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
      .dot.on { background: var(--dc-confirm); }
      .dot.off { background: var(--dc-ink-soft); }
      .email {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--dc-ink);
      }
      .badge {
        display: inline-flex; align-items: center;
        padding: 1px 7px; border-radius: 999px;
        font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
        color: var(--dc-ink-soft); border: 1px solid var(--dc-rule);
        flex: none;
      }
      .badge.pro { background: var(--dc-ink); color: var(--dc-card); border-color: transparent; }

      .plan { margin: 8px 0 0; color: var(--dc-ink-soft); font-size: 12px; }
      .plan b { color: var(--dc-ink); font-weight: 600; }
      .muted { color: var(--dc-ink-soft); font-size: 11.5px; margin: 3px 0 0; }

      /* Credits left, as a quiet bar. Not a nag - you only came here to
         look at it. */
      .meter {
        margin-top: 9px; height: 3px; border-radius: 999px;
        background: var(--dc-rule); overflow: hidden;
      }
      .meter i { display: block; height: 100%; background: var(--dc-ink); border-radius: 999px; }
      .meter i.low { background: var(--dc-guess); }
      .meter i.out { background: var(--dc-ink-soft); }

      .btn {
        display: block; width: 100%; text-align: center;
        padding: 8px 12px; border-radius: 999px;
        font-size: 12.5px; font-weight: 600; text-decoration: none;
        cursor: pointer; border: 1px solid transparent;
        font-family: inherit;
      }
      .btn.primary { background: var(--dc-ink); color: var(--dc-card); }
      .btn.primary:hover { opacity: 0.9; }
      .btn.ghost {
        background: none; color: var(--dc-ink);
        border-color: var(--dc-rule);
      }
      .btn.ghost:hover { border-color: var(--dc-rule); }

      .foot {
        display: flex; align-items: center; gap: 10px;
        padding-top: 11px;
        border-top: 1px solid var(--dc-rule);
      }
      .foot a {
        color: var(--dc-ink-soft); font-size: 11.5px; text-decoration: none;
      }
      .foot a:hover { color: var(--dc-ink); }
      .foot .sp { flex: 1; }

      .hint {
        margin: 10px 0 0; color: var(--dc-ink-soft); font-size: 11.5px;
      }
      kbd {
        background: var(--dc-rule);
        border: 1px solid var(--dc-rule);
        border-radius: 4px; padding: 1px 5px;
        font-family: inherit; font-size: 10.5px; color: var(--dc-ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img src="icons/icon16.png" alt="" />
        <span>Deepclario</span>
      </div>
      <!-- Filled by popup.js. Starts empty rather than with placeholder
           text: a flash of "Loading..." that becomes "Free plan" reads as
           jank in a panel this small. -->
      <div class="body" id="body"></div>
      <div class="foot" id="foot"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
