<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 280px;
        background: #0E0E10;
        color: #F5F4F1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }
      .wrap { padding: 14px; }

      .brand {
        display: flex; align-items: center; gap: 7px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(245, 244, 241, 0.1);
      }
      .brand img { width: 16px; height: 16px; border-radius: 3px; }
      .brand span { font-weight: 600; letter-spacing: -0.01em; }

      .body { padding: 12px 0; min-height: 62px; }

      /* The status line: who you are, what plan. */
      .who { display: flex; align-items: center; gap: 6px; }
      .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
      .dot.on { background: #6FCF97; }
      .dot.off { background: #6b6a66; }
      .email {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: #F5F4F1;
      }
      .badge {
        display: inline-flex; align-items: center;
        padding: 1px 7px; border-radius: 999px;
        font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
        color: #6b6a66; border: 1px solid rgba(245, 244, 241, 0.14);
        flex: none;
      }
      .badge.pro { background: #F5F4F1; color: #0E0E10; border-color: transparent; }

      .plan { margin: 8px 0 0; color: #A8A6A0; font-size: 12px; }
      .plan b { color: #F5F4F1; font-weight: 600; }
      .muted { color: #6b6a66; font-size: 11.5px; margin: 3px 0 0; }

      /* Credits left, as a quiet bar. Not a nag - you only came here to
         look at it. */
      .meter {
        margin-top: 9px; height: 3px; border-radius: 999px;
        background: rgba(245, 244, 241, 0.1); overflow: hidden;
      }
      .meter i { display: block; height: 100%; background: #F5F4F1; border-radius: 999px; }
      .meter i.low { background: #E5A25B; }
      .meter i.out { background: #6b6a66; }

      .btn {
        display: block; width: 100%; text-align: center;
        padding: 8px 12px; border-radius: 999px;
        font-size: 12.5px; font-weight: 600; text-decoration: none;
        cursor: pointer; border: 1px solid transparent;
        font-family: inherit;
      }
      .btn.primary { background: #F5F4F1; color: #0E0E10; }
      .btn.primary:hover { opacity: 0.9; }
      .btn.ghost {
        background: none; color: #F5F4F1;
        border-color: rgba(245, 244, 241, 0.18);
      }
      .btn.ghost:hover { border-color: rgba(245, 244, 241, 0.4); }

      .foot {
        display: flex; align-items: center; gap: 10px;
        padding-top: 11px;
        border-top: 1px solid rgba(245, 244, 241, 0.1);
      }
      .foot a {
        color: #6b6a66; font-size: 11.5px; text-decoration: none;
      }
      .foot a:hover { color: #F5F4F1; }
      .foot .sp { flex: 1; }

      .hint {
        margin: 10px 0 0; color: #6b6a66; font-size: 11.5px;
      }
      kbd {
        background: rgba(245, 244, 241, 0.1);
        border: 1px solid rgba(245, 244, 241, 0.16);
        border-radius: 4px; padding: 1px 5px;
        font-family: inherit; font-size: 10.5px; color: #A8A6A0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img src="icons/icon16.png" alt="" />
        <span>Deepclario</span>
      </div>
      <!-- Filled by popup.js. Starts empty rather than with placeholder
           text: a flash of "Loading..." that becomes "Free plan" reads as
           jank in a panel this small. -->
      <div class="body" id="body"></div>
      <div class="foot" id="foot"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
